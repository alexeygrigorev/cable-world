<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cable World — редактор карты</title>
  </head>
  <body>
    <header id="bar">
      <strong>Мир Троссов — гекс-редактор</strong>
      <div id="tools">
        <button id="saveBtn" title="Сохранить карту">💾 сохранить</button>
        <button id="moveToggle" title="Разрешить менять базовую карту (города, массивы, леса)">🔒 базовая карта</button>
        <button id="liftOverlayToggle" title="Показать/скрыть heatmap подъёмников (L)">L подъёмники</button>
        <button id="undo" title="Отменить (Ctrl+Z)">↶ отмена</button>
        <span id="zoomctl">
          <button id="zoomOut">−</button>
          <span id="zoomVal">100%</span>
          <button id="zoomIn">+</button>
        </span>
      </div>
      <span id="status">Германия · 25 км</span>
    </header>
    <aside id="palette">
      <button id="paletteToggle" class="palette-toggle" title="Показать/скрыть палитру" aria-expanded="true">›</button>
      <div class="palette-scroll">
        <div class="palette-title">Палитра</div>
        <div id="paletteItems"></div>
        <div class="palette-hint">Перетащи на карту</div>
      </div>
    </aside>
    <main id="stage">
      <canvas id="map"></canvas>
    </main>
    <aside id="filters">
      <div class="filters-title">Слои</div>
      <label class="flt-master"><input type="checkbox" id="flt-lifts" /> 🚡 Подъёмники <span class="flt-key">L</span></label>
      <div class="flt-sub">
        <label><input type="checkbox" class="flt-lg" data-g="cable_car" checked /> канатные/фуникулёры</label>
        <label><input type="checkbox" class="flt-lg" data-g="gondola" checked /> гондольные</label>
        <label><input type="checkbox" class="flt-lg" data-g="chair_lift" checked /> кресельные</label>
        <label><input type="checkbox" class="flt-lg" data-g="surface_tow" checked /> бугельные/наземные</label>
        <label><input type="checkbox" class="flt-lg" data-g="zip_line" checked /> зиплайны</label>
        <label><input type="checkbox" class="flt-lg" data-g="water_ski" checked /> вейкборд/водные лыжи</label>
      </div>
      <label class="flt-master"><input type="checkbox" id="flt-mountains" /> ⛰ Горы <span class="flt-key">M</span></label>
      <label class="flt-master"><input type="checkbox" id="flt-elevation" /> 🗻 Высота (тон)</label>
      <label class="flt-master flt-soon"><input type="checkbox" id="flt-towers" disabled /> 📡 Телебашни <span>(скоро)</span></label>
      <label class="flt-master flt-soon"><input type="checkbox" id="flt-wheels" disabled /> 🎡 Колёса обозрения <span>(скоро)</span></label>
    </aside>
    <aside id="panel" hidden>
      <button id="panelClose" title="Закрыть">✕</button>
      <div id="panelBody"></div>
    </aside>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
