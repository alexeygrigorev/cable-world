name: Проверки

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  static:
    name: Статические проверки без Godot
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить Godot
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          INSTALL_EXPORT_TEMPLATES=false scripts/install-godot.sh

      - name: Запустить быстрые проверки
        run: python3 -m unittest discover -s tests
